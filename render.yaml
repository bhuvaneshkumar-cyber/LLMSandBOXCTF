# Render Blueprint: one Docker web service (API and UI on one origin) plus Postgres.
# Free web services sleep after 15 idle minutes (about a minute to wake): for the event itself,
# switch the plan to starter or keep /health pinged.
services:
  - type: web
    name: llm-sandbox
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # Model chain: LLM_MODELS in app/core/config.py. Add GROQ_API_KEY / NVIDIA_API_KEY here to extend it.
      - key: OPENROUTER_API_KEY
        sync: false # entered in the dashboard on first deploy
      - key: GEMINI_API_KEY
        sync: false # fallback when OpenRouter fails or rate-limits
      - key: CTF_FLAG
        sync: false # the secret participants hunt for; never commit it
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: llm-sandbox-db
          property: connectionString

databases:
  # The container disk is wiped on every deploy and every free-tier sleep; accounts must outlive both.
  - name: llm-sandbox-db
    plan: free
    region: oregon
    ipAllowList: [] # Render's private network only
