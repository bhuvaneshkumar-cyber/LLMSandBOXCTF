services:
  - type: web
    name: llm-sandbox
    env: docker
    region: oregon
    plan: free
    # The health check path for zero-downtime deploys
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        # Update this to match your frontend domain once you know it
        value: "https://challenge.gdgvitchennai.com,http://localhost:3000,http://localhost:8000,null"
      - key: DATABASE_URL
        # SQLite local file path mapped to Render's ephemeral disk, OR replace with a remote postgres DB URL
        value: "sqlite+aiosqlite:///./sandbox.db"
      - key: REDIS_URL
        value: "" # Leave blank to use in-memory fallback on the free tier
