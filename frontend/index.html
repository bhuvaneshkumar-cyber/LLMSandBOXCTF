<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault Keeper — LLM Sandbox CTF</title>
    <meta name="description" content="LLM Sandbox CTF — prompt-injection challenge" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app-container">
      <main class="chat-glass-panel">
        <header class="chat-header">
          <div class="header-info">
            <div class="status-indicator"></div>
            <div>
              <h1 class="title">Vault Keeper</h1>
              <p class="subtitle" id="participant-display">Connecting…</p>
            </div>
          </div>
          <div id="solved-badge" class="solved-badge hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            VAULT COMPROMISED
          </div>
        </header>

        <div id="chat-history" class="chat-history">
          <div class="message ai-message">
            <div class="message-content">
              Greetings, seeker. I am the Vault Keeper. State your intent, but choose your words carefully.
            </div>
          </div>
        </div>

        <div class="chat-input-area">
          <form id="chat-form" class="input-form">
            <textarea id="prompt-input" placeholder="Send a message to the vault…" rows="1" required></textarea>
            <button type="submit" id="send-btn" class="send-btn" title="Send (Enter)">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
          <div id="loading-indicator" class="loading-indicator hidden">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Vite processes this as the TypeScript entry point -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
